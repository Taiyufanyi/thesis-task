<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>论文写作打卡 · 第五章 / 讨论 / 结论</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#b5553c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="论文打卡">
<meta name="application-name" content="论文打卡">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f1e7; --card:#fffdf8; --ink:#2b2622; --muted:#7a6f63; --line:#e4dccd;
  --ch5:#b5553c; --ch5s:#f3e1d9; --disc:#3e6b5a; --discs:#dbe9e1; --conc:#4a5a8c; --concs:#dfe3f2;
  --buf:#8a5a9c; --bufs:#ece0f1; --all:#2b2622; --alls:#ebe5da; --rev:#a0782a; --revs:#f2e8d2; --oth:#2f7a86; --oths:#d9eef0;
  --accent:var(--ch5); --soft:var(--ch5s);
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans SC",system-ui,sans-serif;font-size:15px;line-height:1.6}
button{font:inherit}
.layout{max-width:1240px;margin:0 auto;padding:20px 18px 60px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
main{min-width:0}
header h1{font-family:"Noto Serif SC",serif;font-size:28px;margin:0 0 4px;letter-spacing:.5px}
header p{margin:0;color:var(--muted);font-size:14px}

/* ---- 顶栏 ---- */
.tb{background:var(--accent);color:#fff;padding:18px 0 16px;padding-top:max(18px,env(safe-area-inset-top))}
.tb-in{max-width:1240px;margin:0 auto;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.tb-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.tb-title h1{font-family:"Noto Serif SC",serif;font-size:28px;margin:0;letter-spacing:1px}
.tb-title span{font-size:13.5px;opacity:.82}
.tb-row2{margin-top:14px;justify-content:flex-start}
.seg{display:inline-flex;background:rgba(255,255,255,.18);border-radius:40px;padding:5px;gap:4px}
.seg button{border:0;background:transparent;color:#fff;font-size:16px;font-weight:500;padding:9px 26px;border-radius:30px;cursor:pointer;opacity:.85}
.seg button.on{background:#fff;color:var(--accent);opacity:1;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tb-note{font-size:13px;opacity:.85;display:flex;align-items:center;gap:6px}
.tb-note i{width:8px;height:8px;border-radius:50%;background:#f4b860;display:inline-block}
.tb-run{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--accent);border:0;border-radius:30px;padding:8px 16px;cursor:pointer;font-weight:500}
.tb-run i{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite}
.tb-run b{font-family:var(--mono)}
@keyframes pulse{50%{opacity:.25}}

/* ---- 倒计时（右上） ---- */
aside{position:sticky;top:16px;display:flex;flex-direction:column;gap:10px}
.cd-title{font-family:"Noto Serif SC",serif;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.cd-title small{font-family:"Noto Sans SC";color:var(--muted);font-size:12px;font-weight:400}
.cd{border-radius:14px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);position:relative}
.cd.next{background:var(--c);color:#fff;border-color:var(--c);box-shadow:0 10px 26px -12px var(--c)}
.cd .nm{font-size:13px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:6px}
.cd .nm button{border:0;background:none;color:inherit;opacity:.65;cursor:pointer;padding:0 2px;font-size:13px}
.cd .nm button:hover{opacity:1}
.cd .big{font-family:var(--mono);font-weight:700;font-size:30px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--c)}
.cd.next .big{color:#fff;font-size:38px}
.cd .big small{font-size:14px;font-weight:500;margin-left:3px}
.cd .hms{font-family:var(--mono);font-size:14px;opacity:.8;font-variant-numeric:tabular-nums}
.cd .due{font-size:11.5px;opacity:.75}
.cd.past .big{font-size:20px}
.cd input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;width:100%;margin-top:6px;color:var(--ink)}
.cd .pbar{height:4px;border-radius:3px;background:rgba(0,0,0,.08);margin-top:8px;overflow:hidden}
.cd.next .pbar{background:rgba(255,255,255,.3)}
.cd .pbar i{display:block;height:100%;background:var(--c)}
.cd.next .pbar i{background:#fff}
.lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:20px}
.lockbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 30px 26px;width:min(360px,100%);text-align:center;box-shadow:0 20px 50px -24px rgba(80,40,20,.35)}
.lockbox img{border-radius:16px}
.lockbox h2{font-family:"Noto Serif SC",serif;margin:12px 0 2px;font-size:22px}
.lockbox p{margin:0 0 18px;color:var(--muted);font-size:14px}
.lockbox input[type=password]{width:100%;font:inherit;font-size:18px;letter-spacing:4px;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fffefb}
.lockbox input[type=password]:focus{outline:2px solid var(--soft);border-color:var(--accent)}
.lockbox .rem{display:flex;gap:6px;align-items:center;justify-content:center;font-size:13px;color:var(--muted);margin:12px 0}
.lockbox .btn{width:100%;padding:11px}
.lockmsg{color:#c0392b;font-size:13px;min-height:20px;margin-top:8px}
.lock-btn{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;padding:7px;cursor:pointer}
.side-note{font-size:12.5px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.today-btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:8px;cursor:pointer;font-weight:500}
.running-box{background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;font-size:13px}
.running-box b{font-family:var(--mono);font-size:20px;display:block}
.running-box button{margin-top:6px;border:0;border-radius:8px;padding:4px 10px;cursor:pointer}

/* ---- 标签 ---- */
.tabs{display:flex;gap:4px;margin:0 0 18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:9px 12px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;text-align:left}
.tab b{display:block;font-family:"Noto Serif SC",serif;font-size:15.5px}
.tab small{font-size:11.5px}
.tab.on{color:var(--ink);border-color:var(--accent)}

/* ---- 阶段概览 ---- */
.hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-bottom:8px}
.hero h2{font-family:"Noto Serif SC",serif;margin:0 0 4px;font-size:20px}
.hero .range{color:var(--accent);font-weight:500;font-size:13px}
.hero ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:start}
.stat{background:var(--soft);border-radius:10px;padding:8px 10px}
.stat .n{font-size:19px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .l{font-size:11.5px;color:var(--muted)}
.bar{grid-column:1/-1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.moodstrip{grid-column:1/-1;display:flex;gap:3px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.moodstrip span.m{width:21px;height:21px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;background:var(--paper);font-size:12px}

/* ---- 每日卡片 ---- */
.week{font-family:"Noto Serif SC",serif;font-size:15px;color:var(--muted);margin:20px 0 8px;display:flex;align-items:center;gap:10px}
.week:after{content:"";flex:1;height:1px;background:var(--line)}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.day.today{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.day.past:not(.done) .date{background:#efe9de;color:var(--muted)}
.day.done .date{background:var(--accent);color:#fff}
.dhead{display:flex;gap:14px;align-items:center;padding:11px 14px;cursor:pointer;user-select:none}
.date{flex:0 0 58px;text-align:center;border-radius:9px;background:var(--soft);color:var(--accent);padding:5px 0;line-height:1.2}
.date b{display:block;font-size:17px}
.date small{font-size:11px}
.dtitle{flex:1;min-width:0}
.dtitle .sec{font-size:12px;color:var(--accent);font-weight:500}
.dmeta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;white-space:nowrap}
.pill{font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--paper);color:var(--muted)}
.pill.now{background:var(--accent);color:#fff}
.pill.time{font-family:var(--mono)}
.hedit{border:1px solid var(--line);background:#fffefb;color:var(--accent);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.hedit:hover{background:var(--soft);border-color:var(--accent)}
.ph{color:var(--muted);font-style:italic;font-weight:400}
.early{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--soft);border:1px dashed var(--accent);border-radius:12px;padding:12px 16px;margin:12px 0 4px;font-size:13.5px}
.early span{color:var(--muted)}
.early .btn{white-space:nowrap}
.early.soft{background:var(--card);border-style:solid;border-color:var(--line)}
.tab-oth b{color:var(--oth)}
.onav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.onav b{font-size:17px;font-family:"Noto Serif SC",serif}
.onav input[type=date]{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fffefb}
.ototal{margin-left:auto;font-size:13px;color:var(--muted)}
.ototal b{font-family:var(--mono);color:var(--accent);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fffefb;border-radius:30px;padding:9px 16px;font-size:15px;cursor:pointer;color:var(--ink)}
.chip i{width:10px;height:10px;border-radius:3px;background:var(--accent);opacity:.7}
.chip small{font-family:var(--mono);color:var(--muted);font-size:12.5px}
.chip:hover{border-color:var(--accent)}
.chip.run{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.run i{background:#fff;animation:pulse 1.4s infinite}
.chip.run small{color:#fff}
.hint{font-size:12.5px;color:var(--muted);margin-top:10px}
.catedit{display:flex;flex-direction:column;gap:8px}
.catedit div{display:flex;gap:8px;align-items:center}
.catedit input{flex:1}
.ctag{font-size:12px;background:var(--soft);color:var(--accent);border-radius:20px;padding:2px 10px;white-space:nowrap}
.onote{flex:1;min-width:0;border:1px solid transparent!important;background:transparent!important;padding:4px 6px!important}
.onote:hover,.onote:focus{border-color:var(--line)!important;background:#fffefb!important}
.cattot{display:flex;flex-direction:column;gap:8px}
.cattot div{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:14px}
.cattot i{display:block;height:10px;border-radius:5px;background:var(--accent);min-width:2px}
.cattot b{font-family:var(--mono);font-size:13px;text-align:right}
.backfill{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--paper);border-radius:10px;padding:8px 10px;margin:4px 0 10px}
.backfill .bf-l{font-size:13px;color:var(--muted);font-weight:500}
.backfill select,.backfill input{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fffefb;color:var(--ink)}
.backfill select{max-width:230px;flex:1 1 160px}
.backfill .bf-new{flex:1 1 160px}
.backfill .bf-min{width:150px;flex:0 1 150px}
.backfill .bf-btn{padding:6px 14px}
.ed-label{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:12px}
.ed-row textarea{min-height:44px}
.chev{transition:transform .2s;color:var(--muted)}
.day.open .chev{transform:rotate(90deg)}
.dbody{display:none;padding:4px 16px 16px 86px;border-top:1px dashed var(--line)}
.day.open .dbody{display:block}
.tip{font-size:13px;color:var(--muted);background:var(--paper);border-left:3px solid var(--accent);padding:6px 10px;border-radius:0 8px 8px 0;margin:12px 0 4px}
.tasks{list-style:none;padding:0;margin:10px 0}
.task{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:8px}
.task:hover{background:var(--paper)}
.task.run{background:var(--soft)}
.task input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;flex:0 0 auto}
.task .tt{flex:1}
.task.ok .tt{color:var(--muted);text-decoration:line-through}
.clock{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.task.run .clock{color:var(--accent);font-weight:700}
.tbtn{border:1px solid var(--line);background:#fffefb;border-radius:20px;width:30px;height:30px;cursor:pointer;color:var(--accent);flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.task.run .tbtn{background:var(--accent);color:#fff;border-color:var(--accent)}
.task .ti{flex:1;min-width:0}
.task .tm{width:74px}
.ed-row{display:grid;grid-template-columns:120px 1fr;gap:8px;margin:12px 0}
.ed-actions{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.mini{border:1px dashed var(--accent);color:var(--accent);background:none;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px}
.mini.solid{border-style:solid}
.mini.grey{border-color:var(--line);color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;color:var(--muted);font-weight:500}
textarea,input[type=number],input[type=text],input[type=datetime-local]{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fffefb;color:var(--ink);resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--soft);border-color:var(--accent)}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods button{border:1px solid var(--line);background:#fffefb;border-radius:20px;padding:4px 10px;font-size:13px;cursor:pointer}
.moods button.on{background:var(--soft);border-color:var(--accent)}
.checkin{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:500;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.notes{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:22px}
.notes h3{font-family:"Noto Serif SC",serif;margin:0 0 8px;font-size:16px}
.notes textarea{width:100%;min-height:90px}

/* ---- 复盘 ---- */
.rv-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.rv-card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:10px 14px}
.rv-card .l{font-size:12.5px;color:var(--muted)}
.rv-card .n{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--c)}
.rv-card .s{font-size:12px;color:var(--muted)}
h3.rv{font-family:"Noto Serif SC",serif;font-size:16px;margin:22px 0 10px}
table.rv{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px}
table.rv th,table.rv td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.rv th{white-space:nowrap;background:var(--paper);font-weight:500;color:var(--muted);font-size:12.5px}
table.rv td.num{font-family:var(--mono);white-space:nowrap}
table.rv .tk{color:var(--muted);font-size:12.5px}
.feed .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.feed .item .h{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.feed .item .k{font-weight:500;font-size:13px}
.feed .item p{margin:2px 0 8px;white-space:pre-wrap}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.backup{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:28px;font-size:13px;color:var(--muted)}
.backup .btn{padding:6px 14px;font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:30px;font-size:13px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  aside{position:static;order:-1;display:grid;grid-template-columns:repeat(2,1fr)}
  aside .cd-title{grid-column:1/-1}
  aside .running-box,aside .side-note{display:none}
  aside{gap:8px}
  .cd{padding:10px 12px}
  .cd .big{font-size:24px}.cd.next .big{font-size:28px}
}
@media (max-width:640px){
  .tb-title h1{font-size:23px}
  .seg button{padding:8px 20px;font-size:15px}
  .hero{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .dbody{padding-left:14px}
  .fields{grid-template-columns:1fr}
  .dmeta .pill.cnt{display:none}
  .ed-row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="topbar"></div>
<div class="layout">
  <main id="main"></main>
  <aside id="aside"></aside>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
/* =========================================================
   计划数据（默认）：[阶段, 日期, 小标签, 标题, [任务...], 提示]
   页面上可直接编辑，修改会保存在浏览器里；这里是“恢复默认”时的内容
   ========================================================= */
var STAGES = {
  ch5:{name:"第五章",short:"第五章",en:"Findings",start:"2026-11-02",end:"2026-11-17",
    goal:["点每天标题旁的 ✎，自己填写当天内容和任务","每个任务可单独计时","截止前完成本章初稿"]},
  disc:{name:"第六章 讨论",short:"讨论",en:"Discussion",start:"2026-11-18",end:"2026-12-18",
    goal:["点 ✎ 填写每天的写作内容","每周留一天缓冲","截止前完成本章初稿"]},
  conc:{name:"结论",short:"结论",en:"Conclusion",start:"2026-12-19",end:"2027-01-02",
    goal:["点 ✎ 填写每天的写作内容","截止前完成本章初稿"]},
  buf:{name:"缓冲 · 全稿整合",short:"缓冲",en:"Buffer",start:"2027-01-03",end:"2027-01-15",
    goal:["预留给小论文修改与导师意见","全稿整合与格式检查","1 月中旬完成全部初稿"]}

var PMAP = {}; P.forEach(function(p){ PMAP[p[1]]=p; });
var MOODS=[["😄","很好"],["🙂","不错"],["😐","一般"],["😟","焦虑"],["😫","疲惫"]];
var WD=["日","一","二","三","四","五","六"];
var PAPER_RE=/小论文/;

/* =========================================================
   状态（自动保存在本浏览器 localStorage）
   ========================================================= */
var LS_KEY="thesis-checkin-v2";
function ls(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
var state=null;
try{ state=JSON.parse(ls(LS_KEY)||"null"); }catch(e){}
if(!state||typeof state!=="object"){
  state={v:2,days:{},notes:{},deadlines:{},running:null};
  try{ // 迁移旧版记录（心情、灵感等文字）
    var old=JSON.parse(ls("thesis-checkin-v1")||"null");
    if(old&&old.days){ Object.keys(old.days).forEach(function(d){ var o=old.days[d], n={};
      ["mood","moodNote","words","idea","improve","next","checked"].forEach(function(k){ if(o[k]) n[k]=o[k]; });
      state.days[d]=n; }); state.notes=old.notes||{}; }
  }catch(e){}
}
state.days=state.days||{}; state.notes=state.notes||{}; state.deadlines=state.deadlines||{};
if(!state.cats) state.cats=["文献阅读","材料整理","访谈/转录","导师沟通","小论文修改"];
function deadline(k){ return state.deadlines[k]||DEFAULT_DEADLINES[k]; }

var saveTimer=null;
function persist(now){
  clearTimeout(saveTimer);
  var go=function(){ try{ state.savedAt=Date.now(); localStorage.setItem(LS_KEY,JSON.stringify(state)); flash("已自动保存"); }catch(e){ flash("⚠️ 浏览器无法保存，请导出备份"); } };
  if(now) go(); else saveTimer=setTimeout(go,400);
}
function rec(date){ return state.days[date]||(state.days[date]={}); }
var uid=function(){ return "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); };
function tasksOf(date){ // 读：用户改过就用改过的，否则用默认
  var r=state.days[date];
  if(r&&r.tasks) return r.tasks;
  var p=PMAP[date]; return p?p[4].map(function(t,i){ return {id:"d"+i,t:t,done:false,secs:0}; }):[];
}
function mtasks(date){ var r=rec(date); if(!r.tasks) r.tasks=tasksOf(date).map(function(x){ return {id:x.id,t:x.t,done:x.done,secs:x.secs}; }); return r.tasks; }
function titleOf(date){ var r=state.days[date]; return (r&&r.title!=null&&r.title!=="")?r.title:PMAP[date][3]; }
function secOf(date){ var r=state.days[date]; return (r&&r.sec!=null&&r.sec!=="")?r.sec:PMAP[date][2]; }

/* ---------- 计时 ---------- */
function runningExtra(date,id){ var R=state.running; return (R&&R.date===date&&R.id===id)?Math.max(0,(Date.now()-R.start)/1000):0; }
function taskSecs(date,t){ return (t.secs||0)+runningExtra(date,t.id); }
function daySecs(date){ return tasksOf(date).reduce(function(a,t){ return a+taskSecs(date,t); },0); }
function stopRunning(){
  var R=state.running; if(!R) return;
  var ts=mtasks(R.date), t=ts.filter(function(x){return x.id===R.id;})[0];
  if(t) t.secs=(t.secs||0)+Math.max(0,(Date.now()-R.start)/1000);
  state.running=null;
}
function toggleTimer(date,id){
  var R=state.running, same=R&&R.date===date&&R.id===id;
  stopRunning();
  if(!same){ mtasks(date); state.running={date:date,id:id,start:Date.now()}; }
  persist(true);
}
function fmt(s){ s=Math.floor(s); var h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return (h?h+":"+String(m).padStart(2,"0"):String(m).padStart(2,"0"))+":"+String(x).padStart(2,"0"); }
function fmtHM(s){ s=Math.round(s/60); var h=Math.floor(s/60), m=s%60; return h?(h+"小时"+(m?m+"分":"")):(m+"分"); }

/* ---------- 工具 ---------- */
function todayStr(){ var n=new Date(); return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0"); }
var TODAY=todayStr();
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function md(date){ date=String(date).replace(/^o:/,""); var p=date.split("-"); return {m:+p[1],d:+p[2],w:WD[new Date(+p[0],+p[1]-1,+p[2]).getDay()]}; }
/* ---- 阶段起止（可“提前开始”） ---- */
var SORDER=["ch5","disc","conc","buf"];
function addDays(d,n){ var x=new Date(d+"T00:00:00"); x.setDate(x.getDate()+n); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function dayDiff(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); }
function sStart(k){ return (state.starts&&state.starts[k])||STAGES[k].start; }
function sEnd(k){ var i=SORDER.indexOf(k); return i<SORDER.length-1?addDays(sStart(SORDER[i+1]),-1):STAGES[k].end; }
function stageOf(date){ for(var i=SORDER.length-1;i>=0;i--){ if(date>=sStart(SORDER[i])) return SORDER[i]; } return "ch5"; }
function stageDays(key){ var a=sStart(key), b=sEnd(key); return P.filter(function(p){ return p[1]>=a&&p[1]<=b; }); }
function stageOfToday(){ for(var i=0;i<SORDER.length;i++){ if(TODAY<=sEnd(SORDER[i])) return SORDER[i]; } return "buf"; }
function stats(key){
  var ds=stageDays(key), o={total:ds.length,checked:0,tasks:0,tdone:0,words:0,secs:0};
  ds.forEach(function(p){ var r=state.days[p[1]]||{}, ts=tasksOf(p[1]);
    o.tasks+=ts.length; o.tdone+=ts.filter(function(t){return t.done;}).length; o.secs+=daySecs(p[1]);

function cdParts(k){
  var t=new Date(deadline(k)).getTime(), diff=t-Date.now();
  var past=diff<0, a=Math.abs(diff)/1000;
  return {past:past,d:Math.floor(a/86400),h:Math.floor(a%86400/3600),m:Math.floor(a%3600/60),s:Math.floor(a%60),t:t};
}
function nextKey(){ for(var i=0;i<CD_ORDER.length;i++){ if(new Date(deadline(CD_ORDER[i][0])).getTime()>Date.now()) return CD_ORDER[i][0]; } return null; }
function cdInner(k){
  var c=cdParts(k), p2=function(x){return String(x).padStart(2,"0");};
  if(c.past) return '<div class="big">已到期<small>'+c.d+' 天</small></div>';
  var start = k==="all"?new Date(STAGES.ch5.start+"T00:00").getTime():new Date(sStart(k)+"T00:00").getTime();
  var pct=Math.min(100,Math.max(0,(Date.now()-start)/(c.t-start)*100));
  return '<div class="big">'+c.d+'<small>天</small></div><div class="hms">'+p2(c.h)+' : '+p2(c.m)+' : '+p2(c.s)+'</div><div class="pbar" title="时间已过 '+Math.round(pct)+'%"><i style="width:'+pct.toFixed(1)+'%"></i></div>';

/* ---------- 提前开始某阶段 ---------- */
function hasProgress(date,t){ var R=state.running; return t.done||(t.secs||0)>0||(R&&R.date===date&&R.id===t.id); }
function startEarly(k){
  var oldStart=sStart(k), end=sEnd(k), n=dayDiff(TODAY,oldStart);
  var prevK=SORDER[SORDER.indexOf(k)-1];
  if(n<=0||!prevK||TODAY<=sStart(prevK)){ toast("这个阶段现在不能提前开始"); return; }
  try{ localStorage.setItem("tc-undo-"+k, JSON.stringify(state)); }catch(e){}
  // 1) 取出原计划（标题/小标签/任务）
  var plans=[], d;
  for(d=oldStart; d<=end; d=addDays(d,1)){ var r=state.days[d]||{};
    plans.push({from:d, sec:r.sec, title:r.title, tip:r.tip, tasks:(r.tasks||tasksOf(d)).filter(function(t){ return !hasProgress(d,t); }).map(function(t){ return {t:t.t}; })}); }
  // 2) 清掉“今天 ~ 阶段结束”里还没动过的计划（有进度的任务保留）
  for(d=TODAY; d<=end; d=addDays(d,1)){ var r2=rec(d); var keep=tasksOf(d).filter(function(t){ return hasProgress(d,t); });
    r2.tasks=keep.map(function(t){ return {id:t.id,t:t.t,done:t.done,secs:t.secs}; }); delete r2.title; delete r2.sec; delete r2.tip; }
  // 3) 把计划写到往前挪 n 天的位置
  plans.forEach(function(pl){ var to=addDays(pl.from,-n), r3=rec(to);
    if(pl.title) r3.title=pl.title; if(pl.sec) r3.sec=pl.sec; if(pl.tip) r3.tip=pl.tip;
    pl.tasks.forEach(function(t){ r3.tasks.push({id:uid(),t:t.t,done:false,secs:0}); }); });
  // 4) 末尾挪空的几天 → 机动日
  for(d=addDays(end,-n+1); d<=end; d=addDays(d,1)){ var r4=rec(d); if(!r4.title){ r4.sec="机动"; r4.title="机动日（提前开工省下来的时间，可用于小论文）"; } }
  state.starts=state.starts||{}; state.starts[k]=TODAY;
  persist(true); current=k; try{ history.replaceState(null,"","#"+k); }catch(_){}
  openSet=[TODAY]; saveOpen(); render(); window.scrollTo(0,0);
  toast("🚀 "+STAGES[k].short+"已从今天开始");
}
function undoEarly(k){
  try{ var snap=JSON.parse(localStorage.getItem("tc-undo-"+k)||"null"); if(!snap) return;
    stopRunning(); state=snap; state.running=null; localStorage.removeItem("tc-undo-"+k); persist(true); render(); toast("已撤销，恢复原来的日程（撤销后新写的记录会丢失）"); }catch(e){}
}

/* ---------- 补记用时 ---------- */
function parseDur(v){
  v=String(v||"").trim().toLowerCase().replace(/：/g,":").replace(/\s/g,"");
  if(!v) return 0; var m;
  if((m=v.match(/^(\d+):(\d{1,2})$/))) return (+m[1])*60+(+m[2]);
  if((m=v.match(/^(\d+(?:\.\d+)?)(h|小时|时)(?:(\d+)(m|min|分钟|分)?)?$/))) return Math.round(parseFloat(m[1])*60)+(m[3]?+m[3]:0);
  if((m=v.match(/^(\d+(?:\.\d+)?)(m|min|分钟|分)?$/))) return Math.round(parseFloat(m[1]));
  return NaN;
}
function doBackfill(D){
  var sel=document.querySelector('[data-bf-task="'+D+'"]'), mi=document.querySelector('[data-bf-min="'+D+'"]'), nm=document.querySelector('[data-bf-name="'+D+'"]');
  var mins=parseDur(mi.value);
  if(!mins||isNaN(mins)||mins<=0){ toast("请填时长，例如 90、1:30 或 1.5h"); mi.focus(); return; }
  var ts=mtasks(D), t;
  if(sel.value==="__new"){ var name=(nm.value||"").trim()||"补记事项"; t={id:uid(),t:name,done:false,secs:0}; ts.push(t); }
  else t=ts.filter(function(x){return x.id===sel.value;})[0];
  if(!t) return;
  t.secs=(t.secs||0)+mins*60; persist(true); rerender();
  toast("已补记 "+fmtHM(mins*60)+" → "+(t.t.length>14?t.t.slice(0,14)+"…":t.t));
}

/* =========================================================
   密码锁：计划内容以 AES-GCM 加密存放，输入正确密码才在本机解密
   ========================================================= */
var UNLOCK_KEY="tc-unlocked";
function b64(x){ return Uint8Array.from(atob(x),function(ch){return ch.charCodeAt(0);}); }
function decryptPlan(pw){
  var enc=new TextEncoder();
  return crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]).then(function(base){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:ENC.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  }).then(function(key){ return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.i)},key,b64(ENC.c)); })
    .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
}
function mergePlan(plan){
  Object.keys(plan.days).forEach(function(k){
    var r=state.days[k]||(state.days[k]={}), d=plan.days[k];
    if(!r.title&&d.title) r.title=d.title;
    if(!r.sec&&d.sec) r.sec=d.sec;
    if(!r.tasks&&d.tasks) r.tasks=d.tasks;
  });
  if(plan.disc&&state.discPlanV!==plan.v){ applyStagePlan("disc",plan.disc); state.discPlanV=plan.v; }
  if(plan.notes) Object.keys(plan.notes).forEach(function(k){
    var cur=state.notes[k]||""; if(cur.indexOf(plan.notes[k])<0) state.notes[k]=plan.notes[k]+(cur?"\n\n——— 我之前的备忘 ———\n"+cur:"");
  });
  persist(true);
}
// 把一个阶段的计划按顺序排到该阶段的日期上（支持“提前开始”）；有进度的任务保留
function applyStagePlan(k,seq){
  var a=sStart(k), b=sEnd(k), i=0, d;
  for(d=a; d<=b; d=addDays(d,1), i++){
    var r=rec(d), keep=tasksOf(d).filter(function(t){ return hasProgress(d,t); }).map(function(t){ return {id:t.id,t:t.t,done:t.done,secs:t.secs}; });
    var x=seq[i];
    if(x){ r.sec=x.sec; r.title=x.title; r.tip=x.tip||""; r.tasks=keep.concat(x.tasks.map(function(t){ return {id:uid(),t:t,done:false,secs:0}; })); }
    else { r.sec="机动"; r.title="机动日（提前开工省下来的时间，可用于小论文）"; r.tip=""; r.tasks=keep; }
  }
}
function isUnlocked(){ try{ return localStorage.getItem(UNLOCK_KEY)===ENC.v||sessionStorage.getItem(UNLOCK_KEY)===ENC.v; }catch(e){ return false; } }
function wasUnlockedBefore(){ try{ var v=localStorage.getItem(UNLOCK_KEY); return !!v&&v!==ENC.v; }catch(e){ return false; } }
function showLock(){
  document.querySelector(".layout").style.display="none"; document.getElementById("topbar").style.display="none";
  var w=document.createElement("div"); w.className="lock"; w.id="lock";
  w.innerHTML='<form class="lockbox" autocomplete="off"><img src="favicon.svg" alt="" width="64" height="64"><h2>论文写作打卡</h2><p>'+(wasUnlockedBefore()?'计划已更新，请输入新密码解锁':'请输入密码解锁')+'</p>'+
    '<input type="password" id="lockpw" inputmode="numeric" placeholder="密码" autofocus>'+
    '<label class="rem"><input type="checkbox" id="lockrem" checked> 记住这台设备</label>'+
    '<button class="btn" type="submit" id="lockbtn">解锁</button><div class="lockmsg" id="lockmsg"></div></form>';
  document.body.appendChild(w);
  w.querySelector("form").addEventListener("submit",function(e){
    e.preventDefault();
    var pw=document.getElementById("lockpw").value, btn=document.getElementById("lockbtn"), msg=document.getElementById("lockmsg");
    if(!pw) return;
    btn.disabled=true; btn.textContent="解锁中…"; msg.textContent="";
    decryptPlan(pw).then(function(plan){
      mergePlan(plan);
      try{ if(document.getElementById("lockrem").checked) localStorage.setItem(UNLOCK_KEY,ENC.v); else sessionStorage.setItem(UNLOCK_KEY,ENC.v); }catch(_){}
      w.remove(); document.querySelector(".layout").style.display=""; document.getElementById("topbar").style.display=""; render();
    }).catch(function(){
      btn.disabled=false; btn.textContent="解锁"; msg.textContent="密码不对，再试一次";
      var i=document.getElementById("lockpw"); i.select();
    });
  });
  setTimeout(function(){ var i=document.getElementById("lockpw"); if(i) i.focus(); },50);
}
window.__lockNow=function(){ try{ localStorage.removeItem(UNLOCK_KEY); sessionStorage.removeItem(UNLOCK_KEY); }catch(e){} location.reload(); };
if(!window.crypto||!crypto.subtle){ render(); toast("当前环境不支持解锁，请用 https 网址打开"); }
else if(isUnlocked()) render(); else showLock();
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
})();
</script>
</body>
</html>
