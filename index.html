<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>论文写作打卡 · 第五章 / 讨论 / 结论</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f1e7; --card:#fffdf8; --ink:#2b2622; --muted:#7a6f63; --line:#e4dccd;
  --ch5:#b5553c; --ch5s:#f3e1d9; --disc:#3e6b5a; --discs:#dbe9e1; --conc:#4a5a8c; --concs:#dfe3f2;
  --buf:#8a5a9c; --bufs:#ece0f1; --all:#2b2622; --alls:#ebe5da; --rev:#a0782a; --revs:#f2e8d2;
  --accent:var(--ch5); --soft:var(--ch5s);
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans SC",system-ui,sans-serif;font-size:15px;line-height:1.6}
button{font:inherit}
.layout{max-width:1240px;margin:0 auto;padding:26px 18px 60px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
main{min-width:0}
header h1{font-family:"Noto Serif SC",serif;font-size:28px;margin:0 0 4px;letter-spacing:.5px}
header p{margin:0;color:var(--muted);font-size:14px}

/* ---- 倒计时（右上） ---- */
aside{position:sticky;top:16px;display:flex;flex-direction:column;gap:10px}
.cd-title{font-family:"Noto Serif SC",serif;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.cd-title small{font-family:"Noto Sans SC";color:var(--muted);font-size:12px;font-weight:400}
.cd{border-radius:14px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);position:relative}
.cd.next{background:var(--c);color:#fff;border-color:var(--c);box-shadow:0 10px 26px -12px var(--c)}
.cd .nm{font-size:13px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:6px}
.cd .nm button{border:0;background:none;color:inherit;opacity:.65;cursor:pointer;padding:0 2px;font-size:13px}
.cd .nm button:hover{opacity:1}
.cd .big{font-family:var(--mono);font-weight:700;font-size:30px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--c)}
.cd.next .big{color:#fff;font-size:38px}
.cd .big small{font-size:14px;font-weight:500;margin-left:3px}
.cd .hms{font-family:var(--mono);font-size:14px;opacity:.8;font-variant-numeric:tabular-nums}
.cd .due{font-size:11.5px;opacity:.75}
.cd.past .big{font-size:20px}
.cd input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;width:100%;margin-top:6px;color:var(--ink)}
.cd .pbar{height:4px;border-radius:3px;background:rgba(0,0,0,.08);margin-top:8px;overflow:hidden}
.cd.next .pbar{background:rgba(255,255,255,.3)}
.cd .pbar i{display:block;height:100%;background:var(--c)}
.cd.next .pbar i{background:#fff}
.lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:20px}
.lockbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 30px 26px;width:min(360px,100%);text-align:center;box-shadow:0 20px 50px -24px rgba(80,40,20,.35)}
.lockbox img{border-radius:16px}
.lockbox h2{font-family:"Noto Serif SC",serif;margin:12px 0 2px;font-size:22px}
.lockbox p{margin:0 0 18px;color:var(--muted);font-size:14px}
.lockbox input[type=password]{width:100%;font:inherit;font-size:18px;letter-spacing:4px;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fffefb}
.lockbox input[type=password]:focus{outline:2px solid var(--soft);border-color:var(--accent)}
.lockbox .rem{display:flex;gap:6px;align-items:center;justify-content:center;font-size:13px;color:var(--muted);margin:12px 0}
.lockbox .btn{width:100%;padding:11px}
.lockmsg{color:#c0392b;font-size:13px;min-height:20px;margin-top:8px}
.lock-btn{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;padding:7px;cursor:pointer}
.side-note{font-size:12.5px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.today-btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:8px;cursor:pointer;font-weight:500}
.running-box{background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;font-size:13px}
.running-box b{font-family:var(--mono);font-size:20px;display:block}
.running-box button{margin-top:6px;border:0;border-radius:8px;padding:4px 10px;cursor:pointer}

/* ---- 标签 ---- */
.tabs{display:flex;gap:4px;margin:20px 0 18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:9px 12px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;text-align:left}
.tab b{display:block;font-family:"Noto Serif SC",serif;font-size:15.5px}
.tab small{font-size:11.5px}
.tab.on{color:var(--ink);border-color:var(--accent)}

/* ---- 阶段概览 ---- */
.hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-bottom:8px}
.hero h2{font-family:"Noto Serif SC",serif;margin:0 0 4px;font-size:20px}
.hero .range{color:var(--accent);font-weight:500;font-size:13px}
.hero ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:start}
.stat{background:var(--soft);border-radius:10px;padding:8px 10px}
.stat .n{font-size:19px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .l{font-size:11.5px;color:var(--muted)}
.bar{grid-column:1/-1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.moodstrip{grid-column:1/-1;display:flex;gap:3px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.moodstrip span.m{width:21px;height:21px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;background:var(--paper);font-size:12px}

/* ---- 每日卡片 ---- */
.week{font-family:"Noto Serif SC",serif;font-size:15px;color:var(--muted);margin:20px 0 8px;display:flex;align-items:center;gap:10px}
.week:after{content:"";flex:1;height:1px;background:var(--line)}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.day.today{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.day.past:not(.done) .date{background:#efe9de;color:var(--muted)}
.day.done .date{background:var(--accent);color:#fff}
.dhead{display:flex;gap:14px;align-items:center;padding:11px 14px;cursor:pointer;user-select:none}
.date{flex:0 0 58px;text-align:center;border-radius:9px;background:var(--soft);color:var(--accent);padding:5px 0;line-height:1.2}
.date b{display:block;font-size:17px}
.date small{font-size:11px}
.dtitle{flex:1;min-width:0}
.dtitle .sec{font-size:12px;color:var(--accent);font-weight:500}
.dmeta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;white-space:nowrap}
.pill{font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--paper);color:var(--muted)}
.pill.now{background:var(--accent);color:#fff}
.pill.time{font-family:var(--mono)}
.hedit{border:1px solid var(--line);background:#fffefb;color:var(--accent);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.hedit:hover{background:var(--soft);border-color:var(--accent)}
.ph{color:var(--muted);font-style:italic;font-weight:400}
.ed-label{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:12px}
.ed-row textarea{min-height:44px}
.chev{transition:transform .2s;color:var(--muted)}
.day.open .chev{transform:rotate(90deg)}
.dbody{display:none;padding:4px 16px 16px 86px;border-top:1px dashed var(--line)}
.day.open .dbody{display:block}
.tip{font-size:13px;color:var(--muted);background:var(--paper);border-left:3px solid var(--accent);padding:6px 10px;border-radius:0 8px 8px 0;margin:12px 0 4px}
.tasks{list-style:none;padding:0;margin:10px 0}
.task{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:8px}
.task:hover{background:var(--paper)}
.task.run{background:var(--soft)}
.task input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;flex:0 0 auto}
.task .tt{flex:1}
.task.ok .tt{color:var(--muted);text-decoration:line-through}
.clock{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.task.run .clock{color:var(--accent);font-weight:700}
.tbtn{border:1px solid var(--line);background:#fffefb;border-radius:20px;width:30px;height:30px;cursor:pointer;color:var(--accent);flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.task.run .tbtn{background:var(--accent);color:#fff;border-color:var(--accent)}
.task .ti{flex:1;min-width:0}
.task .tm{width:74px}
.ed-row{display:grid;grid-template-columns:120px 1fr;gap:8px;margin:12px 0}
.ed-actions{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.mini{border:1px dashed var(--accent);color:var(--accent);background:none;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px}
.mini.solid{border-style:solid}
.mini.grey{border-color:var(--line);color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;color:var(--muted);font-weight:500}
textarea,input[type=number],input[type=text],input[type=datetime-local]{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fffefb;color:var(--ink);resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--soft);border-color:var(--accent)}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods button{border:1px solid var(--line);background:#fffefb;border-radius:20px;padding:4px 10px;font-size:13px;cursor:pointer}
.moods button.on{background:var(--soft);border-color:var(--accent)}
.checkin{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:500;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.notes{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:22px}
.notes h3{font-family:"Noto Serif SC",serif;margin:0 0 8px;font-size:16px}
.notes textarea{width:100%;min-height:90px}

/* ---- 复盘 ---- */
.rv-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.rv-card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:10px 14px}
.rv-card .l{font-size:12.5px;color:var(--muted)}
.rv-card .n{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--c)}
.rv-card .s{font-size:12px;color:var(--muted)}
h3.rv{font-family:"Noto Serif SC",serif;font-size:16px;margin:22px 0 10px}
table.rv{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px}
table.rv th,table.rv td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.rv th{background:var(--paper);font-weight:500;color:var(--muted);font-size:12.5px}
table.rv td.num{font-family:var(--mono);white-space:nowrap}
table.rv .tk{color:var(--muted);font-size:12.5px}
.feed .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.feed .item .h{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.feed .item .k{font-weight:500;font-size:13px}
.feed .item p{margin:2px 0 8px;white-space:pre-wrap}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.backup{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:28px;font-size:13px;color:var(--muted)}
.backup .btn{padding:6px 14px;font-size:13px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:30px;font-size:13px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  aside{position:static;order:-1;display:grid;grid-template-columns:repeat(2,1fr)}
  aside .cd-title,aside .side-note,aside .today-btn,aside .lock-btn,aside .running-box{grid-column:1/-1}
  .cd .big{font-size:24px}.cd.next .big{font-size:28px}
}
@media (max-width:640px){
  .hero{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .dbody{padding-left:14px}
  .fields{grid-template-columns:1fr}
  .dmeta .pill.cnt{display:none}
  .ed-row{grid-template-columns:1fr}
}
</style>
</head>

function cdParts(k){
  var t=new Date(deadline(k)).getTime(), diff=t-Date.now();
  var past=diff<0, a=Math.abs(diff)/1000;
  return {past:past,d:Math.floor(a/86400),h:Math.floor(a%86400/3600),m:Math.floor(a%3600/60),s:Math.floor(a%60),t:t};
}
function nextKey(){ for(var i=0;i<CD_ORDER.length;i++){ if(new Date(deadline(CD_ORDER[i][0])).getTime()>Date.now()) return CD_ORDER[i][0]; } return null; }
function cdInner(k){
  var c=cdParts(k), p2=function(x){return String(x).padStart(2,"0");};
  if(c.past) return '<div class="big">已到期<small>'+c.d+' 天</small></div>';
  var start = k==="all"?new Date(STAGES.ch5.start+"T00:00").getTime():new Date(STAGES[k].start+"T00:00").getTime();
  var pct=Math.min(100,Math.max(0,(Date.now()-start)/(c.t-start)*100));
  return '<div class="big">'+c.d+'<small>天</small></div><div class="hms">'+p2(c.h)+' : '+p2(c.m)+' : '+p2(c.s)+'</div><div class="pbar" title="时间已过 '+Math.round(pct)+'%"><i style="width:'+pct.toFixed(1)+'%"></i></div>';
}

  var R=state.running; if(!R) return;
  var t=tasksOf(R.date).filter(function(x){return x.id===R.id;})[0]; if(!t) return;
  var s=fmt(taskSecs(R.date,t));
  var c=mainEl.querySelector('[data-clock="'+R.date+'|'+R.id+'"]'); if(c) c.textContent=s;
  var rc=asideEl.querySelector('[data-runclock]'); if(rc) rc.textContent=s;

}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act],[data-tab],[data-toggle]"); if(!el) return;

    if(i>=0){ openSet.splice(i,1); art.classList.remove("open"); } else { openSet.push(d); art.classList.add("open"); }
    saveOpen(); return; }
  var act=el.dataset.act, D=el.dataset.d, ID=el.dataset.id;
  if(act==="tdone") return; // 交给 change
  if(act==="timer"){ toggleTimer(D,ID); rerender(); return; }
  if(act==="mood"){ var r=rec(D); r.mood=r.mood===el.dataset.v?"":el.dataset.v; persist(); rerender(); return; }
  if(act==="check"){ var r2=rec(D); r2.checked=!r2.checked; persist(); rerender(); if(r2.checked) toast("打卡成功，今天辛苦了 🌿"); return; }
  if(act==="hedit"){ e.stopPropagation(); editSet[D]=1; if(openSet.indexOf(D)<0){ openSet.push(D); saveOpen(); } rerender();
    var ti=document.querySelector('[data-dfield="'+D+'|title"]'); if(ti){ ti.focus(); ti.setSelectionRange(ti.value.length,ti.value.length); } return; }
  if(act==="edit"){ if(editSet[D]) delete editSet[D]; else editSet[D]=1; if(openSet.indexOf(D)<0){ openSet.push(D); saveOpen(); } rerender(); return; }
  if(act==="tadd"){ mtasks(D).push({id:uid(),t:"新任务",done:false,secs:0}); persist(); rerender(); return; }
  if(act==="tpaper"){ mtasks(D).push({id:uid(),t:"小论文修改",done:false,secs:0}); persist(); rerender(); toast("已添加「小论文修改」任务"); return; }
  if(act==="tdel"){ var ts=mtasks(D), t=ts.filter(function(x){return x.id===ID;})[0];
    if(t&&(t.secs>60||t.done)&&!confirmInline(el)) return;
    if(state.running&&state.running.date===D&&state.running.id===ID) state.running=null;
    rec(D).tasks=ts.filter(function(x){return x.id!==ID;}); persist(); rerender(); return; }
  if(act==="reset"){ if(!confirmInline(el)) return; if(state.running&&state.running.date===D) stopRunning();
    var r3=rec(D); delete r3.tasks; delete r3.title; delete r3.sec; delete editSet[D]; persist(); rerender(); toast("已清空本日计划"); return; }
  if(act==="cdedit"){ editingCd=editingCd===el.dataset.k?null:el.dataset.k; renderAside(); return; }
  if(act==="cdreset"){ delete state.deadlines[el.dataset.k]; editingCd=null; persist(); renderAside(); return; }
  if(act==="gotoday"){ var k=stageOfToday(); if(current!==k){ current=k; try{ history.replaceState(null,"","#"+k); }catch(_){} }
    if(openSet.indexOf(TODAY)<0){ openSet.push(TODAY); saveOpen(); } render();
    var te=document.getElementById("d-"+TODAY); if(te) te.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(act==="export"){ exportData(); return; }
  if(act==="locknow"){ persist(true); window.__lockNow(); return; }
});
// 二次确认（页面内，不用弹窗）
function confirmInline(el){
  if(el.dataset.armed){ return true; }
  el.dataset.armed="1"; var old=el.textContent; el.textContent="再点一次确认";
  setTimeout(function(){ if(el.isConnected){ delete el.dataset.armed; el.textContent=old; } },2500);
  return false;
}
document.addEventListener("dblclick",function(e){
  var t=e.target.closest(".dtitle"); if(!t) return; var art=t.closest(".day"); if(!art) return;
  var b=art.querySelector('[data-act="hedit"]'); if(b) b.click();
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="importfile"){ importData(el.files[0]); el.value=""; return; }
  if(el.dataset.act==="tdone"){ var D=el.dataset.d, ts=mtasks(D), t=ts.filter(function(x){return x.id===el.dataset.id;})[0];
    if(t){ t.done=el.checked; if(t.done&&state.running&&state.running.date===D&&state.running.id===t.id) stopRunning(); }
    var r=rec(D); if(ts.length&&ts.every(function(x){return x.done;})&&!r.checked){ r.checked=true; toast("今日任务全部完成，已自动打卡 🎉"); }
    persist(); rerender(); return; }
  if(el.dataset.cdinput){ if(el.value){ state.deadlines[el.dataset.cdinput]=el.value; persist(); renderAside(); } return; }
  if(el.dataset.tfield||el.dataset.dfield){ var y=window.scrollY; renderAsideOnly(); window.scrollTo(0,y); }
});
function renderAsideOnly(){ renderAside(); }
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.dataset.field){ var a=el.dataset.field.split("|"); rec(a[0])[a[1]]=el.value; persist(); }
  else if(el.dataset.note){ state.notes[el.dataset.note]=el.value; persist(); }
  else if(el.dataset.dfield){ var b=el.dataset.dfield.split("|"); rec(b[0])[b[1]]=el.value; persist();
    var art=document.getElementById("d-"+b[0]); if(art){ var q=art.querySelector(b[1]==="title"?".dtitle .t":".dtitle .sec"); if(q){ if(el.value) q.textContent=el.value; else q.innerHTML=b[1]==="title"?'<span class="ph">点 ✎ 填写今日内容</span>':''; } } }
  else if(el.dataset.tfield){ var c=el.dataset.tfield.split("|"), t=mtasks(c[0]).filter(function(x){return x.id===c[1];})[0]; if(!t) return;
    if(c[2]==="t") t.t=el.value; else { var mins=Math.max(0,+el.value||0); if(state.running&&state.running.date===c[0]&&state.running.id===c[1]) state.running.start=Date.now(); t.secs=mins*60; }
    persist(); }
});
window.addEventListener("hashchange",function(){ var h=location.hash.slice(1); if((STAGES[h]||h==="review")&&h!==current){ current=h; render(); } });
window.addEventListener("pagehide",function(){ persist(true); });

/* ---------- 导出 / 导入 ---------- */
function exportData(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="论文打卡备份-"+todayStr()+".json"; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500); toast("备份已下载");
}
function importData(file){
  if(!file) return; var fr=new FileReader();
  fr.onload=function(){ try{ var d=JSON.parse(fr.result); if(!d||!d.days) throw 0;
      Object.keys(d.days).forEach(function(k){ state.days[k]=Object.assign(state.days[k]||{}, d.days[k]); });
      if(d.notes) Object.keys(d.notes).forEach(function(k){ if(d.notes[k]) state.notes[k]=d.notes[k]; });
      if(d.deadlines) Object.assign(state.deadlines,d.deadlines);
      if(d.running!==undefined&&!d.planOnly) state.running=d.running;
      persist(true); render(); toast("导入成功 ✓");
    }catch(e){ toast("文件格式不对，导入失败"); } };
  fr.readAsText(file);
}

/* =========================================================
   密码锁：计划内容以 AES-GCM 加密存放，输入正确密码才在本机解密
   ========================================================= */
var UNLOCK_KEY="tc-unlocked";
function b64(x){ return Uint8Array.from(atob(x),function(ch){return ch.charCodeAt(0);}); }
function decryptPlan(pw){
  var enc=new TextEncoder();
  return crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]).then(function(base){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:ENC.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  }).then(function(key){ return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.i)},key,b64(ENC.c)); })
    .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
}
function mergePlan(plan){
  Object.keys(plan.days).forEach(function(k){
    var r=state.days[k]||(state.days[k]={}), d=plan.days[k];
    if(!r.title&&d.title) r.title=d.title;
    if(!r.sec&&d.sec) r.sec=d.sec;
    if(!r.tasks&&d.tasks) r.tasks=d.tasks;
  });
  persist(true);
}
function isUnlocked(){ try{ return localStorage.getItem(UNLOCK_KEY)==="1"||sessionStorage.getItem(UNLOCK_KEY)==="1"; }catch(e){ return false; } }
function showLock(){
  document.querySelector(".layout").style.display="none";
  var w=document.createElement("div"); w.className="lock"; w.id="lock";
  w.innerHTML='<form class="lockbox" autocomplete="off"><img src="favicon.svg" alt="" width="64" height="64"><h2>论文写作打卡</h2><p>请输入密码解锁</p>'+
    '<input type="password" id="lockpw" inputmode="numeric" placeholder="密码" autofocus>'+
    '<label class="rem"><input type="checkbox" id="lockrem" checked> 记住这台设备</label>'+
    '<button class="btn" type="submit" id="lockbtn">解锁</button><div class="lockmsg" id="lockmsg"></div></form>';
  document.body.appendChild(w);
  w.querySelector("form").addEventListener("submit",function(e){
    e.preventDefault();
    var pw=document.getElementById("lockpw").value, btn=document.getElementById("lockbtn"), msg=document.getElementById("lockmsg");
    if(!pw) return;
    btn.disabled=true; btn.textContent="解锁中…"; msg.textContent="";
    decryptPlan(pw).then(function(plan){
      mergePlan(plan);
      try{ if(document.getElementById("lockrem").checked) localStorage.setItem(UNLOCK_KEY,"1"); else sessionStorage.setItem(UNLOCK_KEY,"1"); }catch(_){}
      w.remove(); document.querySelector(".layout").style.display=""; render();
    }).catch(function(){
      btn.disabled=false; btn.textContent="解锁"; msg.textContent="密码不对，再试一次";
      var i=document.getElementById("lockpw"); i.select();
    });
  });
  setTimeout(function(){ var i=document.getElementById("lockpw"); if(i) i.focus(); },50);
}
window.__lockNow=function(){ try{ localStorage.removeItem(UNLOCK_KEY); sessionStorage.removeItem(UNLOCK_KEY); }catch(e){} location.reload(); };
if(!window.crypto||!crypto.subtle){ render(); toast("当前环境不支持解锁，请用 https 网址打开"); }
else if(isUnlocked()) render(); else showLock();
})();
</script>
